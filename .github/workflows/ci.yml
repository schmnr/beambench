name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (build, test, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          # GitHub's Azure mirror can accept the connection and then stop
          # responding. Use Ubuntu's HTTPS archive directly so setup fails or
          # succeeds promptly instead of consuming the entire job timeout.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libudev-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            squashfs-tools \
            fontconfig

      - name: Test AppImage camera, display and font compatibility policy
        run: |
          python3 scripts/test-linux-appimage-runtime.py
          python3 scripts/test-linux-appimage-desktop-probe.py
          python3 scripts/test-connected-library-driver.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: taiki-e/install-action@nextest

      - name: Test optimized GLib string iterator security backport
        run: cargo run --locked --release --manifest-path scripts/glib-variant-probe/Cargo.toml

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # pdf417 is a vendored crate with pre-existing clippy/test issues;
      # the project policy is to always exclude it from workspace runs.
      - name: Build
        run: cargo build --workspace --exclude pdf417

      - name: Test
        run: cargo nextest run --workspace --exclude pdf417

      - name: Clippy
        run: cargo clippy --workspace --exclude pdf417

      - name: Format check
        run: cargo fmt --all -- --check

  macos-serial:
    name: macOS serial initialization regression
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Test serial transport without hardware
        run: cargo test -p beambench-serial --lib

      - name: Reproduce stale-speed driver behavior
        run: python3 scripts/test-macos-serial-open.py

  frontend:
    name: Frontend (build, test, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tauri-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: tauri-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: |
          npm run test
          node --test ../scripts/check-windows-runtime.test.mjs

      - name: Performance budgets
        run: npm run test:perf

      - name: Build
        run: npm run build

  windows-source-tests:
    name: Windows source tests
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Check installed-package smoke script syntax
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/test-windows-installed-package.ps1'),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors -join "`n") }

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-source-${{ hashFiles('**/Cargo.lock') }}

      - name: Reproduce and recover Windows CH340 initialization failure
        run: ./scripts/test-windows-ch340-recovery.ps1

      - name: Test planning and machine-service behavior
        run: cargo test -p beambench-service -p beambench-planner -p beambench-grbl -p beambench-serial -p beambench-tauri

      - name: Test remote host startup, authentication and Windows shutdown
        run: cargo test -p beambench-cli --test remote_host

      - name: Test remote job execution and reconnect behavior
        run: cargo test -p beambench-api

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Test frontend contracts
        working-directory: tauri-app
        run: npm test

  windows-runtime:
    name: Windows release runtime isolation
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json
      - name: Verify runtime isolation control
        run: ./scripts/test-windows-runtime.ps1 -ControlOnly -OutputDirectory "$env:RUNNER_TEMP/windows-runtime-evidence/control-precheck"
      - uses: actions/cache/restore@v6
        id: runtime-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/x86_64-pc-windows-msvc/release
          key: ${{ runner.os }}-runtime-release-${{ hashFiles('**/Cargo.lock', '.cargo/windows-release.toml') }}
      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci
      - name: Build and audit standalone release CLI
        id: runtime-cli
        run: node tauri-app/scripts/build-cli-release.mjs --target x86_64-pc-windows-msvc --out-dir "$env:RUNNER_TEMP/windows-runtime-cli"
      - name: Build actual release desktop without publishing
        id: runtime-desktop
        working-directory: tauri-app
        run: |
          $cargoConfig = (Resolve-Path ../.cargo/windows-release.toml).Path
          npx tauri build --ci --no-sign --no-bundle --target x86_64-pc-windows-msvc -- --locked --config $cargoConfig
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Start CLI and desktop with the VC runtime blocked
        run: |
          ./scripts/test-windows-runtime.ps1 `
            -Cli "$env:RUNNER_TEMP/windows-runtime-cli/beambench-cli.exe" `
            -Desktop target/x86_64-pc-windows-msvc/release/beambench-tauri.exe `
            -OutputDirectory "$env:RUNNER_TEMP/windows-runtime-evidence"
      - name: Test static-runtime geometry and remote host lifecycle
        run: |
          cargo test --locked --release --target x86_64-pc-windows-msvc --config .cargo/windows-release.toml -p beambench-core --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --release --target x86_64-pc-windows-msvc --config .cargo/windows-release.toml -p beambench-cli --test remote_host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload runtime isolation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Windows-runtime-isolation
          path: ${{ runner.temp }}/windows-runtime-evidence
          if-no-files-found: ignore
      - name: Cache completed release builds
        if: always() && steps.runtime-cli.outcome == 'success' && steps.runtime-desktop.outcome == 'success' && steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/x86_64-pc-windows-msvc/release
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

  windows-source:
    name: Windows source regression
    needs: [windows-source-tests, windows-runtime]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require source and runtime checks
        env:
          SOURCE_RESULT: ${{ needs.windows-source-tests.result }}
          RUNTIME_RESULT: ${{ needs.windows-runtime.result }}
        run: test "$SOURCE_RESULT" = success && test "$RUNTIME_RESULT" = success
