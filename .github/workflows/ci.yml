name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (build, test, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          # GitHub's Azure mirror can accept the connection and then stop
          # responding. Use Ubuntu's HTTPS archive directly so setup fails or
          # succeeds promptly instead of consuming the entire job timeout.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libudev-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            squashfs-tools \
            fontconfig

      - name: Test AppImage camera, display and font compatibility policy
        run: |
          python3 scripts/test-linux-appimage-runtime.py
          python3 scripts/test-linux-appimage-desktop-probe.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: taiki-e/install-action@nextest

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # pdf417 is a vendored crate with pre-existing clippy/test issues;
      # the project policy is to always exclude it from workspace runs.
      - name: Build
        run: cargo build --workspace --exclude pdf417

      - name: Test
        run: cargo nextest run --workspace --exclude pdf417

      - name: Clippy
        run: cargo clippy --workspace --exclude pdf417

      - name: Format check
        run: cargo fmt --all -- --check

  macos-serial:
    name: macOS serial initialization regression
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Test serial transport without hardware
        run: cargo test -p beambench-serial --lib

      - name: Reproduce stale-speed driver behavior
        run: python3 scripts/test-macos-serial-open.py

  frontend:
    name: Frontend (build, test, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tauri-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: tauri-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Performance budgets
        run: npm run test:perf

      - name: Build
        run: npm run build

  windows-source:
    name: Windows source regression
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Check installed-package smoke script syntax
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/test-windows-installed-package.ps1'),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors -join "`n") }

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-source-${{ hashFiles('**/Cargo.lock') }}

      - name: Test Windows initial DTR configuration
        run: |
          $serialTestRoot = Join-Path $env:RUNNER_TEMP 'beambench-serialport-tests'
          Copy-Item vendor/serialport $serialTestRoot -Recurse
          Add-Content (Join-Path $serialTestRoot 'Cargo.toml') "`n[workspace]"
          cargo test --manifest-path "$serialTestRoot/Cargo.toml" --target-dir target/serialport-regression --lib

      - name: Test planning and machine-service behavior
        run: cargo test -p beambench-service -p beambench-planner -p beambench-grbl -p beambench-serial -p beambench-tauri

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Test frontend contracts
        working-directory: tauri-app
        run: npm test
