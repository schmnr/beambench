# Builds the Linux AppImage and attaches it to a GitHub Release.
#
# Trigger:
#   "Run workflow" button on the GitHub Actions page.
#
# Pushing v* tags intentionally does not auto-release. Keep releases deliberate
# so GitHub Actions minutes are not spent by accident.
#
# Output:
#   - A workflow artifact containing the .AppImage and .sig files.
#   - Optionally attaches the .AppImage and .sig to the GitHub Release when the
#     "Attach to GitHub Release" input is checked.
#
name: Release Linux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.1)."
        required: true
        type: string
      attach_to_release:
        description: "Attach Linux artifacts to the GitHub Release."
        required: false
        default: false
        type: boolean
      validate_connected_library_only:
        description: "Test saved login in an existing signed AppImage. Does not rebuild or publish."
        required: false
        default: false
        type: boolean
      artifact_run_id:
        description: "Successful Linux release build whose AppImage should be tested."
        required: false
        default: "40154787781"
        type: string
      wallet_provider:
        description: "Native Linux password service to exercise for saved login and prompts."
        required: false
        default: gnome
        type: choice
        options:
          - gnome
          - kde
      validation_scenario:
        description: "Full wallet lifecycle, or final deletion of approved disposable account B."
        required: false
        default: full
        type: choice
        options:
          - full
          - deletion

concurrency:
  # Serialize expensive same-tag builds and release uploads. The shared asset
  # uploader also enumerates drafts explicitly because GitHub's release-by-tag
  # endpoint excludes them.
  # NOTE: a concurrency group holds at most ONE pending run. Dispatch the three
  # platform workflows one at a time, waiting for each to finish; dispatching
  # all three together cancels the queued run (see docs/releasing.md).
  group: beambench-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-linux:
    if: ${{ !inputs.validate_connected_library_only }}
    name: Build Linux AppImage
    # Pinned to the oldest supported runner on purpose: the AppImage links
    # the build host's glibc, so building on ubuntu-latest (24.04, glibc
    # 2.39) produced binaries that refuse to start on Debian 12 (2.36) and
    # Ubuntu 22.04 LTS (2.35). Building on 22.04 sets the floor at glibc
    # 2.35. Do not bump back to ubuntu-latest without deciding to drop
    # those users.
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    permissions:
      contents: write   # needed to create / update the GitHub Release
    steps:
      - name: Resolve release tag
        id: tag
        env:
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG_INPUT"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $tag"
            exit 1
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.tag.outputs.value }}

      - name: Validate required secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=0
          for name in \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repository secret: ${name}"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install system dependencies
        run: |
          # GitHub's Azure mirror can accept the connection and then stop
          # responding. Use Ubuntu's HTTPS archive directly so release setup
          # does not consume the entire job timeout.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libudev-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            squashfs-tools \
            fontconfig \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            python3 \
            file \
            wget

      - name: Test AppImage camera, display and font compatibility policy
        run: |
          python3 scripts/test-linux-appimage-runtime.py
          python3 scripts/test-linux-appimage-desktop-probe.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Verify release source
        run: |
          cargo test -p beambench-service -p beambench-planner -p beambench-grbl
          npm --prefix tauri-app test

      - name: Build and verify x64 CLI
        run: |
          set -euo pipefail

          version="${{ steps.tag.outputs.version }}"
          target="x86_64-unknown-linux-gnu"
          cli_dir="$GITHUB_WORKSPACE/target/release-staging/cli/$version/$target"
          archive="$cli_dir/Beam.Bench.CLI_${version}_${target}.tar.gz"
          checksum="${archive}.sha256"

          node tauri-app/scripts/build-cli-release.mjs \
            --target "$target" \
            --version "$version" \
            --out-dir "$cli_dir"

          rm -f "$archive" "$checksum"
          tar -C "$cli_dir" -czf "$archive" \
            beambench-cli \
            LICENSE \
            COPYRIGHT \
            SOURCE.md \
            THIRD_PARTY_NOTICES.md \
            THIRD_PARTY_LICENSES.md

          verify_dir="$RUNNER_TEMP/beambench-cli-verify"
          rm -rf "$verify_dir"
          mkdir -p "$verify_dir"
          tar -C "$verify_dir" -xzf "$archive"
          node tauri-app/scripts/build-cli-release.mjs \
            --target "$target" \
            --version "$version" \
            --out-dir "$verify_dir" \
            --verify-only

          (
            cd "$cli_dir"
            sha256sum "$(basename "$archive")" > "$(basename "$checksum")"
            sha256sum -c "$(basename "$checksum")"
          )

      - name: Build AppImage
        working-directory: tauri-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles appimage -- --locked

      - name: Harden and re-sign AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          appimage=$(find target/release/bundle/appimage -name '*.AppImage' -type f | head -n 1)
          if [ -z "$appimage" ]; then
            echo "No AppImage produced." >&2
            exit 1
          fi

          scripts/harden-linux-appimage "$appimage"
          (
            cd tauri-app
            npx tauri signer sign "$GITHUB_WORKSPACE/$appimage"
          )
          scripts/harden-linux-appimage --check "$appimage"
          BEAMBENCH_TEST_APPIMAGE="$GITHUB_WORKSPACE/$appimage" \
            python3 scripts/test-linux-appimage-runtime.py

          if [ ! -f "${appimage}.sig" ]; then
            echo "No updater signature produced for the hardened AppImage." >&2
            exit 1
          fi

      # Keep the oldest builder. Newer hosts validate the exact signed package
      # without raising the desktop binary's glibc floor.
      - name: Launch final desktop on Ubuntu 22.04, 24.04 and 26.04
        run: |
          set -euo pipefail
          appimage=$(find target/release/bundle/appimage -name '*.AppImage' -type f | head -n 1)
          python3 scripts/test-linux-appimage-desktop.py "$appimage" \
            --output "$RUNNER_TEMP/linux-desktop-smoke.json"

      - name: Upload desktop launch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: BeamBench-Linux-desktop-${{ inputs.tag }}
          path: ${{ runner.temp }}/linux-desktop-smoke.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Locate AppImage
        id: locate
        run: |
          set -euo pipefail
          appimage=$(find target/release/bundle/appimage -name '*.AppImage' -type f | head -n 1)
          if [ -z "$appimage" ]; then
            echo "No AppImage produced." >&2
            exit 1
          fi
          signature="${appimage}.sig"
          if [ ! -f "$signature" ]; then
            echo "No Tauri updater signature produced for the Linux AppImage." >&2
            exit 1
          fi
          echo "Found: $appimage"
          echo "Found: $signature"
          version="${{ steps.tag.outputs.version }}"
          cli_dir="$GITHUB_WORKSPACE/target/release-staging/cli/$version/x86_64-unknown-linux-gnu"
          cli_archive="$cli_dir/Beam.Bench.CLI_${version}_x86_64-unknown-linux-gnu.tar.gz"
          if [ ! -f "$cli_archive" ]; then
            echo "No standalone CLI archive produced." >&2
            exit 1
          fi
          cli_checksum="${cli_archive}.sha256"
          if [ ! -f "$cli_checksum" ]; then
            echo "No standalone CLI checksum produced." >&2
            exit 1
          fi
          echo "Found: $cli_archive"
          echo "Found: $cli_checksum"
          echo "path=$appimage" >> "$GITHUB_OUTPUT"
          echo "signature=$signature" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$appimage")" >> "$GITHUB_OUTPUT"
          {
            echo "files<<EOF"
            printf '%s\n' "$appimage" "$signature" "$cli_archive" "$cli_checksum"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload AppImage as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: BeamBench-Linux-${{ steps.tag.outputs.value }}
          path: ${{ steps.locate.outputs.files }}
          retention-days: 30

      - name: Attach AppImage to GitHub Release
        if: ${{ inputs.attach_to_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
          RELEASE_FILES: ${{ steps.locate.outputs.files }}
        run: |
          set -euo pipefail
          arguments=()
          while IFS= read -r artifact; do
            if [ -n "$artifact" ]; then
              arguments+=(--file "$artifact")
            fi
          done <<< "$RELEASE_FILES"
          node tauri-app/scripts/upload-release-assets.mjs \
            --tag "$RELEASE_TAG" \
            "${arguments[@]}"

  validate-connected-library:
    if: ${{ inputs.validate_connected_library_only }}
    name: Signed Linux connected-library lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout validation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download unchanged signed candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_RUN: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > "$RUNNER_TEMP/build-run.json"
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          source=$(git rev-parse "$RELEASE_TAG^{}")
          jq -e --arg source "$source" '.conclusion == "success" and .path == ".github/workflows/release-linux.yml" and .head_sha == $source' "$RUNNER_TEMP/build-run.json"
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name "BeamBench-Linux-$RELEASE_TAG" --dir "$RUNNER_TEMP/candidate"
          mapfile -t images < <(find "$RUNNER_TEMP/candidate" -type f -name '*.AppImage')
          [[ ${#images[@]} == 1 ]]
          chmod +x "${images[0]}"
          echo "CANDIDATE_APPIMAGE=${images[0]}" >> "$GITHUB_ENV"

      - name: Prepare disposable password-store test host
        run: docker build -t beambench-wallet-validation scripts/connected-library-smoke

      - name: Test paid login, real GNOME storage, account switch and disconnect
        env:
          BEAMBENCH_PILOT_ACCOUNTS: ${{ secrets.CRAFTGINEER_PHASE2_TEST_ACCOUNTS }}
          WALLET_PROVIDER: ${{ inputs.wallet_provider }}
          VALIDATION_SCENARIO: ${{ inputs.validation_scenario }}
          BEAMBENCH_PILOT_DELETE_PROOF: ${{ secrets.CRAFTGINEER_PHASE2_DELETE_PROOF }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/beambench-connected-library"
          mkdir -p "$evidence"
          sudo chown 1100:1100 "$evidence"
          docker run --rm --cap-drop ALL --memory 3g --cpus 2 --pids-limit 768 \
            --env BEAMBENCH_PILOT_ACCOUNTS \
            --env BEAMBENCH_PILOT_DELETE_PROOF \
            --mount "type=bind,source=$CANDIDATE_APPIMAGE,target=/test.AppImage,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/scripts,target=/scripts,readonly" \
            --mount "type=bind,source=$evidence,target=/evidence" \
            beambench-wallet-validation bash /scripts/connected-library-smoke/run.sh "$WALLET_PROVIDER" "$VALIDATION_SCENARIO"

      - name: Upload non-secret lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: BeamBench-Linux-connected-library-${{ inputs.wallet_provider }}-${{ inputs.tag }}
          path: |
            ${{ runner.temp }}/beambench-connected-library/provider.json
            ${{ runner.temp }}/beambench-connected-library/wallet-created.json
            ${{ runner.temp }}/beambench-connected-library/*/results.json
            ${{ runner.temp }}/beambench-connected-library/*/failure.json
            ${{ runner.temp }}/beambench-connected-library/*/wallet-*.json
            ${{ runner.temp }}/beambench-connected-library/*/*.png
          if-no-files-found: warn
          retention-days: 14
