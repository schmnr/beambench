# Builds signed Windows installers, or validates an existing signed candidate.
#
# Trigger:
#   "Run workflow" button on the GitHub Actions page.
#
# Pushing v* tags intentionally does not auto-release. Keep releases deliberate
# so GitHub Actions minutes are not spent by accident.
#
name: Release Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.1)."
        required: true
        type: string
      include_msi:
        description: "Also attempt the optional MSI package. The signed NSIS updater remains the release gate."
        required: false
        default: false
        type: boolean
      attach_to_release:
        description: "Attach Windows artifacts to the GitHub Release. Leave off for package validation."
        required: false
        default: false
        type: boolean
      validate_connected_library_only:
        description: "Test saved login using an existing signed artifact and approved disposable accounts. Does not build or publish."
        required: false
        default: false
        type: boolean
      artifact_run_id:
        description: "Successful Windows build run to download for connected-library validation."
        required: false
        default: "40156432393"
        type: string
      library_provider:
        description: "Connected library to validate with approved disposable accounts."
        required: false
        default: craftgineer
        type: choice
        options:
          - craftgineer
          - printcutcarve

concurrency:
  # Serialize expensive same-tag builds and release uploads. The shared asset
  # uploader also enumerates drafts explicitly because GitHub's release-by-tag
  # endpoint excludes them.
  # NOTE: a concurrency group holds at most ONE pending run. Dispatch the three
  # platform workflows one at a time, waiting for each to finish; dispatching
  # all three together cancels the queued run (see docs/releasing.md).
  group: beambench-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  DOTNET_ROLL_FORWARD: LatestMinor
  DOTNET_ROLL_FORWARD_TO_PRERELEASE: "0"
  WINDOWS_SIGNING_ACCOUNT: Beambench
  WINDOWS_SIGNING_CERTIFICATE_PROFILE: BeamBenchPublicTrust
  WINDOWS_SIGNING_ENDPOINT: https://eus.codesigning.azure.net/

jobs:
  build-windows:
    if: ${{ !inputs.validate_connected_library_only }}
    name: Build signed Windows installers
    runs-on: windows-2025
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Resolve release tag
        id: tag
        env:
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG_INPUT
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$') {
            Write-Error "Invalid release tag: $tag"
            exit 1
          }
          "value=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$($tag.Substring(1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.tag.outputs.value }}

      - name: Validate required secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $missing = @()
          foreach ($name in @(
            "AZURE_CLIENT_ID",
            "AZURE_CLIENT_SECRET",
            "AZURE_TENANT_ID",
            "TAURI_SIGNING_PRIVATE_KEY",
            "TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $missing += $name
            }
          }

          if ($missing.Count -gt 0) {
            foreach ($name in $missing) {
              Write-Error "Missing required repository secret: $name"
            }
            exit 1
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-windows-${{ hashFiles('**/Cargo.lock', '.cargo/windows-release.toml') }}

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Verify release source
        run: |
          cargo test -p beambench-service -p beambench-planner -p beambench-grbl -p beambench-tauri
          npm --prefix tauri-app test

      - name: Install Artifact Signing CLI
        run: |
          cargo install artifact-signing-cli --locked
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Check Windows signing tools
        run: |
          $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe"
          $az = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"

          if (!(Test-Path $signtool)) {
            Write-Error "Expected SignTool at $signtool"
            exit 1
          }

          if (!(Test-Path $az)) {
            Write-Error "Expected Azure CLI at $az"
            exit 1
          }

          dotnet --list-sdks
          dotnet --list-runtimes
          & $az version

      - name: Prepare Artifact Signing client
        run: |
          $config = Join-Path $HOME ".artifact-signing-cli"
          $lib = Join-Path $config "lib"
          $dll = Join-Path $lib "bin\x64\Azure.CodeSigning.Dlib.dll"

          New-Item -ItemType Directory -Force -Path $config | Out-Null

          if (!(Test-Path $dll)) {
            $version = "1.0.128"
            $nupkg = Join-Path $config "$version.nupkg"
            $archive = Join-Path $config $version
            $url = "https://www.nuget.org/api/v2/package/Microsoft.ArtifactSigning.Client/$version"

            Invoke-WebRequest -Uri $url -OutFile $nupkg -MaximumRedirection 10

            $package = Get-Item $nupkg
            if ($package.Length -lt 100000) {
              Write-Error "Downloaded Artifact Signing client package is unexpectedly small: $($package.Length) bytes."
              exit 1
            }

            $bytes = [System.IO.File]::ReadAllBytes($nupkg)
            if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x50 -or $bytes[1] -ne 0x4B) {
              Write-Error "Downloaded Artifact Signing client package is not a zip archive."
              exit 1
            }

            if (Test-Path $lib) {
              Remove-Item $lib -Recurse -Force
            }

            Add-Type -AssemblyName System.IO.Compression.FileSystem
            [System.IO.Compression.ZipFile]::ExtractToDirectory($nupkg, $lib, $true)

            if (!(Test-Path $dll)) {
              Write-Error "Expected Artifact Signing client DLL after extraction: $dll"
              exit 1
            }

            Copy-Item $nupkg $archive -Force
          }

          "Artifact Signing client ready at $dll"

      - name: Smoke test Azure signing
        env:
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ env.WINDOWS_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ env.WINDOWS_SIGNING_CERTIFICATE_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          $source = "$env:USERPROFILE\.cargo\bin\artifact-signing-cli.exe"
          $smoke = Join-Path $env:RUNNER_TEMP "beambench-signing-smoke.exe"
          Copy-Item $source $smoke -Force

          artifact-signing-cli `
            -e $env:WINDOWS_SIGNING_ENDPOINT `
            -a $env:WINDOWS_SIGNING_ACCOUNT `
            -c $env:WINDOWS_SIGNING_CERTIFICATE_PROFILE `
            -d "Beam Bench Signing Smoke Test" `
            $smoke

          $signature = Get-AuthenticodeSignature -FilePath $smoke
          "{0}: {1} ({2})" -f $smoke, $signature.Status, $signature.SignerCertificate.Subject
          if ($signature.Status -ne "Valid") {
            Write-Error "Azure signing smoke test did not produce a valid Authenticode signature."
            exit 1
          }

      - name: Build, sign, and verify x64 CLI
        env:
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ env.WINDOWS_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ env.WINDOWS_SIGNING_CERTIFICATE_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          $version = "${{ steps.tag.outputs.version }}"
          $target = "x86_64-pc-windows-msvc"
          $cliDir = Join-Path "target\release-staging\cli\$version" $target
          $cli = Join-Path $cliDir "beambench-cli.exe"
          $archive = Join-Path $cliDir "Beam.Bench.CLI_${version}_${target}.zip"
          $checksum = "$archive.sha256"

          node tauri-app/scripts/build-cli-release.mjs `
            --target $target `
            --version $version `
            --out-dir $cliDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          artifact-signing-cli `
            -e $env:WINDOWS_SIGNING_ENDPOINT `
            -a $env:WINDOWS_SIGNING_ACCOUNT `
            -c $env:WINDOWS_SIGNING_CERTIFICATE_PROFILE `
            -d "Beam Bench CLI" `
            $cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $signature = Get-AuthenticodeSignature -FilePath $cli
          "{0}: {1} ({2})" -f $cli, $signature.Status, $signature.SignerCertificate.Subject
          if ($signature.Status -ne "Valid") {
            Write-Error "CLI Authenticode verification failed: $($signature.Status)"
            exit 1
          }

          Remove-Item $archive, $checksum -Force -ErrorAction SilentlyContinue
          $packageFiles = @(
            $cli,
            (Join-Path $cliDir "LICENSE"),
            (Join-Path $cliDir "COPYRIGHT"),
            (Join-Path $cliDir "SOURCE.md"),
            (Join-Path $cliDir "THIRD_PARTY_NOTICES.md"),
            (Join-Path $cliDir "THIRD_PARTY_LICENSES.md")
          )
          Compress-Archive -Path $packageFiles -DestinationPath $archive -Force

          $verifyDir = Join-Path $env:RUNNER_TEMP "beambench-cli-verify"
          Remove-Item $verifyDir -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $archive -DestinationPath $verifyDir -Force
          node tauri-app/scripts/build-cli-release.mjs `
            --target $target `
            --version $version `
            --out-dir $verifyDir `
            --verify-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $verifiedCli = Join-Path $verifyDir "beambench-cli.exe"
          $verifiedSignature = Get-AuthenticodeSignature -FilePath $verifiedCli
          if ($verifiedSignature.Status -ne "Valid") {
            Write-Error "Archived CLI Authenticode verification failed: $($verifiedSignature.Status)"
            exit 1
          }

          $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          $checksumLine = "$hash  $([System.IO.Path]::GetFileName($archive))`n"
          [System.IO.File]::WriteAllText(
            $checksum,
            $checksumLine,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Build required signed NSIS installer
        working-directory: tauri-app
        env:
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ env.WINDOWS_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ env.WINDOWS_SIGNING_CERTIFICATE_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $cargoConfig = (Resolve-Path ../.cargo/windows-release.toml).Path
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis -- --locked --config $cargoConfig
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build optional signed MSI installer
        id: msi
        if: ${{ inputs.include_msi }}
        continue-on-error: true
        working-directory: tauri-app
        env:
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ env.WINDOWS_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ env.WINDOWS_SIGNING_CERTIFICATE_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $cargoConfig = (Resolve-Path ../.cargo/windows-release.toml).Path
          npx tauri build --target x86_64-pc-windows-msvc --bundles msi -- --locked --config $cargoConfig
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record optional MSI result
        if: ${{ always() && inputs.include_msi }}
        env:
          MSI_OUTCOME: ${{ steps.msi.outcome }}
        run: |
          if ($env:MSI_OUTCOME -eq "success") {
            "### Optional MSI package: succeeded" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            "### Optional MSI package: failed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "The signed NSIS updater is still eligible for release. Inspect the uploaded WiX diagnostics before re-enabling MSI as a required artifact." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Upload WiX diagnostics
        if: ${{ always() && inputs.include_msi && steps.msi.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: BeamBench-WiX-diagnostics-${{ steps.tag.outputs.value }}
          path: |
            target/x86_64-pc-windows-msvc/release/wix
            target/x86_64-pc-windows-msvc/release/bundle/msi
          if-no-files-found: warn
          retention-days: 30

      - name: Audit desktop runtime dependencies before packaging validation
        run: |
          node scripts/check-windows-runtime.mjs target/x86_64-pc-windows-msvc/release/beambench-tauri.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate Windows artifacts
        id: locate
        run: |
          $version = "${{ steps.tag.outputs.version }}"
          $nsisDir = "target\x86_64-pc-windows-msvc\release\bundle\nsis"
          $setupInstallers = @(Get-ChildItem -Path $nsisDir -File -Filter "*-setup.exe")
          if ($setupInstallers.Count -ne 1) {
            Write-Error "Expected exactly one signed NSIS setup installer, found $($setupInstallers.Count)."
            exit 1
          }
          $setupInstaller = $setupInstallers[0]
          $setupSignature = "$($setupInstaller.FullName).sig"
          if (!(Test-Path $setupSignature -PathType Leaf)) {
            Write-Error "Required NSIS updater signature is missing: $setupSignature"
            exit 1
          }

          $bundleArtifacts = @($setupInstaller, (Get-Item $setupSignature))
          $msiArtifacts = @(Get-ChildItem -Path "target\x86_64-pc-windows-msvc\release\bundle\msi" -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -eq ".msi" -or $_.Name.EndsWith(".msi.sig") })
          $bundleArtifacts += $msiArtifacts
          $cliDir = Join-Path "target\release-staging\cli\$version" "x86_64-pc-windows-msvc"
          $cliArchive = Join-Path $cliDir "Beam.Bench.CLI_${version}_x86_64-pc-windows-msvc.zip"
          $cliChecksum = "$cliArchive.sha256"
          if (!(Test-Path $cliArchive -PathType Leaf) -or !(Test-Path $cliChecksum -PathType Leaf)) {
            Write-Error "Verified standalone CLI archive or checksum is missing."
            exit 1
          }
          $cliArtifacts = @(Get-Item $cliArchive, $cliChecksum)
          $artifacts = @(($bundleArtifacts + $cliArtifacts) | Sort-Object FullName)

          if ($artifacts.Count -eq 0) {
            Write-Error "No Windows release artifacts produced."
            exit 1
          }

          "Found Windows artifacts:"
          $artifacts | ForEach-Object { "  $($_.FullName)" }

          "files<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $artifacts | ForEach-Object { $_.FullName } | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify Authenticode signatures
        run: |
          $signedArtifacts = Get-ChildItem -Path target -Recurse -File -Include *.exe,*.msi |
            Where-Object { $_.FullName -like "*\target\x86_64-pc-windows-msvc\release\bundle\*" } |
            Sort-Object FullName

          if ($signedArtifacts.Count -eq 0) {
            Write-Error "No Windows installers found for signature verification."
            exit 1
          }

          $failed = @()
          foreach ($artifact in $signedArtifacts) {
            $signature = Get-AuthenticodeSignature -FilePath $artifact.FullName
            "{0}: {1} ({2})" -f $artifact.FullName, $signature.Status, $signature.SignerCertificate.Subject
            if ($signature.Status -ne "Valid") {
              $failed += $artifact.FullName
            }
          }

          if ($failed.Count -gt 0) {
            Write-Error "Windows signature verification failed for: $($failed -join ', ')"
            exit 1
          }

      - name: Verify updater signatures
        run: |
          $setupInstallers = @(Get-ChildItem -Path "target\x86_64-pc-windows-msvc\release\bundle\nsis" -File -Filter "*-setup.exe")
          if ($setupInstallers.Count -ne 1) {
            Write-Error "Expected exactly one NSIS updater installer, found $($setupInstallers.Count)."
            exit 1
          }
          $signature = "$($setupInstallers[0].FullName).sig"
          if (!(Test-Path $signature -PathType Leaf) -or (Get-Item $signature).Length -eq 0) {
            Write-Error "Required NSIS updater signature is missing or empty: $signature"
            exit 1
          }
          "Updater signature: $signature"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: BeamBench-Windows-${{ steps.tag.outputs.value }}
          path: ${{ steps.locate.outputs.files }}
          retention-days: 30

      - name: Test signed installer and actual desktop startup
        run: |
          $installers = @(Get-ChildItem -Path "target\x86_64-pc-windows-msvc\release\bundle\nsis" -File -Filter "*-setup.exe")
          if ($installers.Count -ne 1) { throw "Expected one signed NSIS installer." }
          ./scripts/test-windows-installed-package.ps1 `
            -Installer $installers[0].FullName `
            -OutputDirectory "$env:RUNNER_TEMP\beambench-installed-smoke"

      - name: Test native Windows credential backend
        run: |
          $result = & cargo run --locked --manifest-path scripts/credential-store-probe/Cargo.toml -- --native
          if ($LASTEXITCODE -ne 0 -or ($result -join "`n").Trim() -ne "credential_round_trip=ok") {
            throw "The disposable native credential round trip failed."
          }
          $result | Set-Content "$env:RUNNER_TEMP\beambench-installed-smoke\credential-probe.txt"

      - name: Upload installed desktop test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: BeamBench-Windows-installed-${{ steps.tag.outputs.value }}
          path: ${{ runner.temp }}/beambench-installed-smoke
          if-no-files-found: ignore
          retention-days: 30

      - name: Attach Windows artifacts to GitHub Release
        if: ${{ inputs.attach_to_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
          RELEASE_FILES: ${{ steps.locate.outputs.files }}
        run: |
          $paths = @($env:RELEASE_FILES -split "`r?`n" | Where-Object { ![string]::IsNullOrWhiteSpace($_) })
          if ($paths.Count -eq 0) {
            Write-Error "No Windows release artifacts found to attach."
            exit 1
          }

          $arguments = @("tauri-app/scripts/upload-release-assets.mjs", "--tag", $env:RELEASE_TAG)
          foreach ($path in $paths) {
            $arguments += @("--file", $path)
          }

          node @arguments
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Could not attach Windows artifacts to GitHub Release $env:RELEASE_TAG."
            exit 1
          }

  validate-connected-library:
    if: ${{ inputs.validate_connected_library_only }}
    name: Signed Windows connected-library lifecycle
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout validation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download and install unchanged signed candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_RUN: ${{ inputs.artifact_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:BUILD_RUN -notmatch '^[0-9]+$' -or $env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$') {
            throw 'Invalid candidate reference.'
          }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or $run.path -ne '.github/workflows/release-windows.yml') {
            throw 'Use a successful signed Windows release build.'
          }
          git fetch origin "refs/tags/$env:RELEASE_TAG`:refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate tag could not be fetched.' }
          $source = git rev-parse "$env:RELEASE_TAG^{}"
          if ($LASTEXITCODE -ne 0 -or $source -ne $run.head_sha) { throw 'Build source differs from candidate tag.' }
          $download = Join-Path $env:RUNNER_TEMP 'beambench-library-candidate'
          gh run download $env:BUILD_RUN --repo $env:GITHUB_REPOSITORY --name "BeamBench-Windows-$env:RELEASE_TAG" --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Candidate download failed.' }
          $installers = @(Get-ChildItem $download -Recurse -Filter '*-setup.exe')
          if ($installers.Count -ne 1 -or (Get-AuthenticodeSignature $installers[0].FullName).Status -ne 'Valid') {
            throw 'Exactly one valid signed installer is required.'
          }
          $install = Join-Path $env:RUNNER_TEMP 'beambench-library-installed'
          $setup = Start-Process $installers[0].FullName -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          if ($setup.ExitCode -notin @(0, 3010)) { throw 'Installer failed.' }
          $app = Join-Path $install 'beambench-tauri.exe'
          if ((Get-AuthenticodeSignature $app).Status -ne 'Valid') { throw 'Installed signature is invalid.' }
          if ((Get-Item $app).VersionInfo.ProductVersion -ne $env:RELEASE_TAG.Substring(1)) { throw 'Installed version differs.' }
          "app=$app" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Install native Windows accessibility test driver
        run: |
          python -m pip install pywinauto==0.6.9 pillow
          if ($LASTEXITCODE -ne 0) { throw 'Native driver installation failed.' }

      - name: Test actual account login, restoration, account switch and disconnect
        env:
          CRAFTGINEER_TEST_ACCOUNTS: ${{ secrets.CRAFTGINEER_PHASE2_TEST_ACCOUNTS }}
          PRINTCUTCARVE_TEST_ACCOUNTS: ${{ secrets.PRINTCUTCARVE_DESKTOP_TEST_ACCOUNTS }}
          LIBRARY_PROVIDER: ${{ inputs.library_provider }}
          CANDIDATE_APP: ${{ steps.candidate.outputs.app }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:LIBRARY_PROVIDER -eq 'printcutcarve') {
            $env:BEAMBENCH_PILOT_ACCOUNTS = $env:PRINTCUTCARVE_TEST_ACCOUNTS
          } elseif ($env:LIBRARY_PROVIDER -eq 'craftgineer') {
            $env:BEAMBENCH_PILOT_ACCOUNTS = $env:CRAFTGINEER_TEST_ACCOUNTS
          } else { throw 'Unsupported connected library.' }
          if ([string]::IsNullOrWhiteSpace($env:BEAMBENCH_PILOT_ACCOUNTS)) { throw 'Approved disposable accounts are required.' }
          $arguments = @('scripts/test-connected-library-desktop.py', '--provider', $env:LIBRARY_PROVIDER,
            '--application', $env:CANDIDATE_APP, '--output', "$env:RUNNER_TEMP\beambench-connected-library")
          if ($env:LIBRARY_PROVIDER -eq 'printcutcarve') { $arguments += @('--check-startup-ad', '--check-project-import') }
          python @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Connected-library desktop validation failed.' }

      - name: Verify remembered credential was removed
        run: |
          $entries = cmdkey /list
          if ($LASTEXITCODE -ne 0) { throw 'Credential metadata could not be checked.' }
          if (($entries -join "`n") -match [regex]::Escape('com.beambench.desktop-library')) {
            throw 'A provider credential remains after disconnect and session-only testing.'
          }
          '{"providerCredentialAbsent":true}' | Set-Content "$env:RUNNER_TEMP\beambench-connected-library\credential-cleanup.json"

      - name: Upload non-secret lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: BeamBench-Windows-connected-library-${{ inputs.library_provider }}-${{ inputs.tag }}
          path: |
            ${{ runner.temp }}/beambench-connected-library/results.json
            ${{ runner.temp }}/beambench-connected-library/failure.json
            ${{ runner.temp }}/beambench-connected-library/failure.txt
            ${{ runner.temp }}/beambench-connected-library/desktop.log
            ${{ runner.temp }}/beambench-connected-library/credential-cleanup.json
            ${{ runner.temp }}/beambench-connected-library/*.png
          if-no-files-found: warn
          retention-days: 14
