[package]
name = "beambench-credential-store-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

# Keep this experiment out of the desktop dependency graph until Phase 2.
[workspace]

[dependencies]
keyring-core = { version = "=1.0.1", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }
