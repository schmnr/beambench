[package]
name = "beambench-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
beambench-common = { path = "../../crates/beambench-common" }
beambench-api = { path = "../../crates/beambench-api" }
beambench-buildinfo = { path = "../../crates/beambench-buildinfo" }
beambench-core = { path = "../../crates/beambench-core" }
beambench-planner = { path = "../../crates/beambench-planner" }
beambench-project = { path = "../../crates/beambench-project" }
beambench-raster = { path = "../../crates/beambench-raster" }
beambench-serial = { path = "../../crates/beambench-serial" }
beambench-grbl = { path = "../../crates/beambench-grbl" }
beambench-streamer = { path = "../../crates/beambench-streamer" }
beambench-preview = { path = "../../crates/beambench-preview" }
beambench-service = { path = "../../crates/beambench-service" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
# Current updates use raw NSIS/AppImage packages and macOS tar.gz archives.
# macOS archive support is unconditional; the legacy Windows ZIP/Linux tar
# feature would add a separate, vulnerable ZIP dependency we do not use.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }
tauri-plugin-window-state = "2"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
image = { workspace = true }
sha2 = "0.10"
base64 = { workspace = true }
dirs = { workspace = true }
keyring-core = { version = "=1.0.1", default-features = false }
zeroize = { version = "1", features = ["derive"] }
arboard = "3.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"] }
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSButton",
  "NSApplication",
  "NSControl",
  "NSPanel",
  "NSPasteboard",
  "NSPopUpButton",
  "NSResponder",
  "NSSavePanel",
  "NSTextField",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "NSArray",
  "NSString",
  "NSURL",
  "objc2-core-foundation",
  "std",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["rt-tokio-crypto-rust"] }
libc = "0.2"
open = "5.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = { workspace = true }
